name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "octra-sqlite") | .version')"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          release_manifest="release/octra-sqlite-$package_version.json"
          wasm_path="circle/wasm/octra_sqlite_circle.wasm"
          test -f "$release_manifest"
          test "$(jq -r '.release' "$release_manifest")" = "$package_version"
          devnet_proof="$(jq -r '.verification.devnet // empty' "$release_manifest")"
          case "$devnet_proof" in
            passed|inherited_from_*) ;;
            *)
              echo "release manifest devnet proof is not complete: $devnet_proof" >&2
              exit 1
              ;;
          esac
          test "$(jq -r '.public_deployment.status // empty' "$release_manifest")" = "deployed"
          proof_status_text="$(
            jq -r '[
              .status // "",
              .verification.devnet // "",
              .public_deployment.status // "",
              .public_deployment.deployment_kind // ""
            ] | join("\n")' "$release_manifest"
          )"
          if printf '%s\n' "$proof_status_text" | grep -Eiq 'pending|candidate'; then
            echo "release manifest still contains pending/candidate proof status" >&2
            exit 1
          fi
          expected_bytes="$(jq -r '.wasm.bytes' "$release_manifest")"
          expected_sha256="$(jq -r '.wasm.sha256' "$release_manifest")"
          actual_bytes="$(wc -c < "$wasm_path" | tr -d ' ')"
          actual_sha256="$(sha256sum "$wasm_path" | awk '{print $1}')"
          test "$expected_bytes" = "$actual_bytes"
          test "$expected_sha256" = "$actual_sha256"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify package
        run: cargo publish --locked --dry-run

  crates-io:
    name: crates.io
    needs: verify
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        run: cargo +stable publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
