name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXPECTED_WASM_SHA256: 8fe0dad1a4bb4fcfc7afab626a58eda45edeac3b25607f130b201997698d8bcf
      EXPECTED_WASM_BYTES: "611677"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install WASM audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 wabt
      - name: Rust tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Protocol/client core without HTTP
        run: cargo build --locked --no-default-features --lib
      - name: HTTP client without CLI
        run: cargo check --locked --no-default-features --features http
      - name: WASM behavior harness feature
        run: cargo check --locked --no-default-features --features wasm-behavior --all-targets
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Supply-chain audit
        run: cargo audit
      - name: Script syntax
        run: find scripts -name '*.sh' -exec bash -n {} \;
      - name: Check bundled WASM artifact
        run: |
          test -f circle/wasm/octra_sqlite_circle.wasm
          test "$(wc -c < circle/wasm/octra_sqlite_circle.wasm | tr -d ' ')" = "$EXPECTED_WASM_BYTES"
          test "$(sha256sum circle/wasm/octra_sqlite_circle.wasm | awk '{print $1}')" = "$EXPECTED_WASM_SHA256"
          bash scripts/audit-wasm.sh circle/wasm/octra_sqlite_circle.wasm
      - name: WASM behavior harness
        run: OCTRA_SQLITE_WASM=circle/wasm/octra_sqlite_circle.wasm cargo test --locked --features wasm-behavior --test wasm_host_harness
